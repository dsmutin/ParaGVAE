[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paragvae"
dynamic = ["version"]
description = "Graph VAE binning on MetaMetro coloured graph tensors"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["metametro>=0.16.0"]

[project.scripts]
paragvae = "paragvae.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
