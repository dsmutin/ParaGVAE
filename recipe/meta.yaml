{% set version = load_file_contents("VERSION").strip() %}

package:
  name: paragvae
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - paragvae = paragvae.cli:main

requirements:
  host:
    - python 3.12
    - pip
    - setuptools
  run:
    - python 3.12

test:
  imports:
    - paragvae
  commands:
    - paragvae --version

about:
  home: https://github.com/dsmutin/ParaGVAE
  license: MIT
  license_file: LICENSE
  summary: "Graph VAE binning on MetaMetro coloured graph tensors"
