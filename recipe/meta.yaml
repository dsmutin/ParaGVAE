{% set version = load_file_contents("VERSION").strip() %}

package:
  name: paragvae
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - paragvae = paragvae.cli:main

requirements:
  host:
    - python 3.12
    - pip
    - setuptools
  run:
    - python 3.12.14
    - numpy 2.5.3
    - scipy 1.18.1
    - scikit-learn 1.9.1
    - pyyaml 6.0.3
    - pandas 3.0.6
    - altair 6.2.2
    - vl-convert-python 2.0.0rc7

test:
  imports:
    - paragvae
  commands:
    - paragvae --version

about:
  home: https://github.com/dsmutin/ParaGVAE
  license: MIT
  license_file: LICENSE
  summary: "Graph VAE binning on MetaMetro coloured graph tensors"
