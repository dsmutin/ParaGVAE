# metametro>=0.16.0 must be installed in this environment. It is not a conda package.
# Install that checkout into the env; do not hard-code its path in this repo.
name: paragvae
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12.14
  - setuptools=84.0.0
  - pytest=9.1.1
  - pytest-cov=7.1.0
  - numpy=2.5.3
  - scipy=1.18.1
  - scikit-learn=1.9.1
  - pyyaml=6.0.3
  - pandas=3.0.6
  - altair=6.2.2
  - vl-convert-python=2.0.0rc7
  - gxx_linux-64=16.2.0
  - cami-amber=2.0.7
  - hdbscan=0.8.44
variables:
  PYTHONPATH: src
