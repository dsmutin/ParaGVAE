name: full tests

# The toy example is the baseline CLI. It does not load a benchbuild directory.
# Completion graphs are MetaMetro benches and are not built in this workflow.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: full-tests
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          auto-update-conda: true
          activate-environment: paragvae
          environment-file: environment.yml
      - name: Install MetaMetro
        run: bash scripts/ci_install_metametro.sh
      - name: All pytest (mandatory and optional)
        timeout-minutes: 30
        run: pytest --tb=short
      - name: Toy example
        timeout-minutes: 15
        run: python examples/toy/run.py
      - name: Extra examples and vignettes
        timeout-minutes: 60
        run: |
          set -euo pipefail
          shopt -s nullglob
          for s in examples/*/run.py examples/*/pipeline.sh; do
            case "$s" in
              examples/toy/run.py) continue ;;
            esac
            if [[ "$s" == *.py ]]; then python "$s"; else bash "$s"; fi
          done
          for s in vignettes/*.sh vignettes/*.py; do
            if [[ "$s" == *.py ]]; then python "$s"; else bash "$s"; fi
          done
